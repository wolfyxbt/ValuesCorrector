<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>价值观纠正器</title>
    <meta name="description" content="把加密货币、法币和现实物品放在同一把价值标尺上。">
    
    <!-- Favicon 完整支持 -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="favicon/favicon.ico">
    <meta name="theme-color" content="#080808">
    <!-- Apply the saved appearance before styles load to avoid a light flash. -->
    <script src="theme.js?v=20260913-11"></script>

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="价值观纠正器">
    
    <!-- Google tag (gtag.js) -->

	    <link rel="stylesheet" href="styles.css?v=20260913-11">
</head>
<body>
    <main class="container">
        <header class="app-header">
            <h1>价值观纠正器</h1>
            <div class="header-actions" role="group" aria-label="网站快捷操作">
                <a href="https://x.com/wolfyxbt" target="_blank" rel="noopener noreferrer" class="author" aria-label="在 X 上关注作者">
                    <!-- X 官方标志（简化版路径） -->
                    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zM17.083 19.77h1.833L7.084 4.126H5.117z"/>
                    </svg>
                </a>
                <a href="https://github.com/WolfyXBT/ValuesCorrector" target="_blank" rel="noopener noreferrer" class="author" aria-label="查看 GitHub 仓库">
                    <!-- GitHub 官方 Octocat 标志（经典轮廓） -->
                    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.02c-3.34.73-4.03-1.41-4.03-1.41-.55-1.39-1.33-1.76-1.33-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.49 1 .11-.78.42-1.3.76-1.6-2.66-.31-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.31-.54-1.53.12-3.18 0 0 1.01-.32 3.3 1.23.96-.27 1.98-.4 3-.41 1.02.01 2.05.14 3.01.41 2.29-1.55 3.3-1.23 3.3-1.23.65 1.65.24 2.87.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.81 5.62-5.49 5.92.43.37.82 1.1.82 2.22v3.29c0 .32.22.69.83.58C20.57 21.8 24 17.3 24 12 24 5.37 18.63 0 12 0z"/>
                    </svg>
                </a>
                <!-- 添加到主屏幕按钮 -->
                <button id="addToHomeBtn" class="author add-to-home-btn" type="button" aria-label="添加到主屏幕" title="添加到主屏幕">
                    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 1.5h8A3.5 3.5 0 0 1 19.5 5v14A3.5 3.5 0 0 1 16 22.5H8A3.5 3.5 0 0 1 4.5 19V5A3.5 3.5 0 0 1 8 1.5zm0 2A1.5 1.5 0 0 0 6.5 5v14A1.5 1.5 0 0 0 8 20.5h8A1.5 1.5 0 0 0 17.5 19V5A1.5 1.5 0 0 0 16 3.5H8z"/>
                        <path d="M12 7.5c.55 0 1 .45 1 1v2.5h2.5a1 1 0 1 1 0 2H13v2.5a1 1 0 1 1-2 0V13H8.5a1 1 0 1 1 0-2H11V8.5c0-.55.45-1 1-1z"/>
                    </svg>
                </button>
                <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换到浅色模式" title="切换到浅色模式">
                    <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" />
                        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
                    </svg>
                    <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20.5 13.1A8.7 8.7 0 0 1 10.9 3.5 8.7 8.7 0 1 0 20.5 13.1Z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- 6 个换算栏位由 app.js 的 buildCurrencyFields() 依据 ASSET_CONFIG 动态生成 -->
        <div id="currencyFields"></div>
        <p id="apiStatus" class="api-status" role="status" aria-live="polite">汇率加载中</p>

	    <footer class="social-links" aria-label="分享操作">
	        <!-- 分享操作 -->
	        <div class="share-center">
	            <button id="shareSiteBtn" class="share-btn" type="button" title="复制网站分享文案">
	                <span class="btn-content">
	                    <svg viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
	                        <path d="M10 13a5 5 0 0 1 0-7l.7-.7a5 5 0 0 1 7.1 7.1l-.7.7"></path>
	                        <path d="M14 11a5 5 0 0 1 0 7l-.7.7a5 5 0 0 1-7.1-7.1l.7-.7"></path>
	                    </svg>
	                    复制网址&nbsp;
	                </span>
	            </button>
	            <button id="shareBtn" class="share-btn primary" title="生成分享图">
	                <span class="btn-content">
	                    <svg viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
	                        <rect x="4" y="5" width="16" height="14" rx="3"></rect>
	                        <path d="M8.5 14.5l2.5-3 3 3.5 2-2 2 2.5"></path>
	                        <path d="M9 10.5h.01"></path>
	                    </svg>
	                    分享结果&nbsp;
	                </span>
	            </button>
	        </div>
	    </footer>

			    <script src="fiat.js?v=20260913-11"></script>
                <script src="app.js?v=20260913-11"></script>
    </main>

	    <!-- Toast 提示 -->
	    <div id="shareToast" class="toast" role="status" aria-live="polite" aria-atomic="true">
	        <div class="toast-icon">✅</div>
	        <div class="toast-text"></div>
	    </div>

	    <!-- 自定义代币弹窗 -->
	    <div id="customTokenModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="customTokenModalTitle" aria-hidden="true">
	        <div class="modal-content">
		            <div class="modal-header">
		                <h3 id="customTokenModalTitle">自定义代币搜索</h3>
		                <button class="close" type="button" aria-label="关闭自定义代币搜索" onclick="closeCustomTokenModal()">&times;</button>
		            </div>
	            <div class="modal-body">
                <div class="search-container">
	                    <input type="text" id="tokenSearchInput" aria-label="搜索代币" placeholder="输入代币名称或符号" autocomplete="off" spellcheck="false" />
                </div>
                <div id="searchResults" class="search-results"></div>
                <div id="loadingIndicator" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>正在搜索代币...</p>
                </div>
            </div>
	        </div>
	    </div>

    <div id="installGuideModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="installGuideTitle" aria-describedby="installGuideDescription" aria-hidden="true">
        <div class="modal-content install-guide">
            <div class="modal-header">
                <h3 id="installGuideTitle">添加到主屏幕</h3>
                <button class="close" type="button" aria-label="关闭添加指引">&times;</button>
            </div>
            <div class="modal-body">
                <div class="install-intro">
                    <img class="install-app-icon" src="favicon/apple-touch-icon.png" alt="" width="56" height="56" />
                    <div><strong>价值观纠正器</strong><p id="installGuideDescription">放到主屏幕，下次直接打开。</p></div>
                </div>
                <span id="installPlatform" class="install-platform"></span>
                <ol id="installSteps" class="install-steps"></ol>
                <button id="installGuideAction" class="share-btn primary" type="button">知道了</button>
            </div>
        </div>
    </div>

    <!-- 自定义法币：沿用代币搜索弹窗的布局和键盘操作 -->
    <div id="customFiatModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="customFiatModalTitle" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="customFiatModalTitle">自定义法币搜索</h3>
                <button class="close" type="button" aria-label="关闭自定义法币搜索">&times;</button>
            </div>
            <div class="modal-body">
                <div class="search-container">
                    <input id="fiatSearchInput" type="text" aria-label="搜索法币" placeholder="输入法币名称或代码，如欧元、EUR" autocomplete="off" spellcheck="false" />
                </div>
                <p id="fiatSearchStatus" class="fiat-search-status" role="status" aria-live="polite"></p>
                <div id="fiatSearchResults" class="search-results"></div>
            </div>
        </div>
    </div>

	    <!-- 分享图预览弹窗 -->
	    <div id="shareImageModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="shareImageModalTitle" aria-hidden="true">
	        <div class="modal-content share-modal-content">
	            <div class="modal-header">
	                <h3 id="shareImageModalTitle">分享图预览</h3>
	                <button class="close" type="button" aria-label="关闭分享图预览" onclick="closeShareImageModal()">&times;</button>
	            </div>
	            <div class="modal-body">
	                <div class="share-preview">
	                    <img id="shareImagePreview" alt="分享图预览" />
	                </div>
	                <div class="share-actions">
	                    <button class="primary" id="copyShareImageBtn">
	                        <span style="display:inline-flex; align-items:center; gap:8px; justify-content:center;">
	                            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
	                                <path d="M8 7.5A3.5 3.5 0 0 1 11.5 4h7A3.5 3.5 0 0 1 22 7.5v9A3.5 3.5 0 0 1 18.5 20h-7A3.5 3.5 0 0 1 8 16.5v-9zm3.5-1.5A1.5 1.5 0 0 0 10 7.5v9a1.5 1.5 0 0 0 1.5 1.5h7a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 18.5 6h-7z"/>
	                                <path d="M2 6.5A3.5 3.5 0 0 1 5.5 3h.5a1 1 0 1 1 0 2h-.5A1.5 1.5 0 0 0 4 6.5v9A1.5 1.5 0 0 0 5.5 17H6a1 1 0 1 1 0 2h-.5A3.5 3.5 0 0 1 2 15.5v-9z"/>
	                            </svg>
	                            复制图片
	                        </span>
	                    </button>
	                    <button id="downloadShareImageBtn">
	                        <span style="display:inline-flex; align-items:center; gap:8px; justify-content:center;">
	                            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
	                                <path d="M12 2.5c.55 0 1 .45 1 1v8.2l2.23-2.23a1 1 0 1 1 1.41 1.42l-3.94 3.94a1 1 0 0 1-1.41 0L7.36 10.9a1 1 0 1 1 1.41-1.42L11 11.7V3.5c0-.55.45-1 1-1z"/>
	                                <path d="M6.5 14c.55 0 1 .45 1 1v2.5c0 .55.45 1 1 1h7c.55 0 1-.45 1-1V15c0-.55.45-1 1-1s1 .45 1 1v2.5c0 1.66-1.34 3-3 3h-7c-1.66 0-3-1.34-3-3V15c0-.55.45-1 1-1z"/>
	                            </svg>
	                            下载图片
	                        </span>
	                    </button>
	                </div>
	            </div>
	        </div>
	    </div>

</body>
</html>
